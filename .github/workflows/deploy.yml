name: Deploy Backend API to Oracle Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/api
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart lanka-offers-api || pm2 start dist/app/server.js --name lanka-offers-api
            pm2 save
            sleep 2
            curl -f -s http://127.0.0.1:3001/api/health
